<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>AI Chatbot V6</title>

<link rel="stylesheet"
href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css">

</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="logo">

<div class="logoIcon">

🤖

</div>

<div>

<h2>

AI Chatbot

</h2>

<p>

Premium V6

</p>

</div>

</div>

<button id="newChat">

<i class="fa-solid fa-plus"></i>

New Chat

</button>

<div class="searchBox">

<i class="fa-solid fa-magnifying-glass"></i>

<input
id="searchInput"
placeholder="Search Chats">

</div>

<div
id="history"
class="history">

</div>

<div class="bottomButtons">

<button id="exportChat">

Export

</button>

<button id="themeToggle">

🌙

</button>

</div>

</aside>
<!-- MAIN -->

<main class="main">

<header class="topBar">

<div>

<h1>AI Assistant</h1>

<p>Powered by Gemini</p>

</div>

<div class="topButtons">

<button id="voiceOutput">

🔊

</button>

<button id="settingsBtn">

⚙️

</button>

</div>

</header>

<section
id="chatBox"
class="chatBox">

<div class="botMessage">

<div class="avatar">

🤖

</div>

<div class="message">

<h3>

Hello 👋

</h3>

<p>

Welcome to AI Chatbot V6.

</p>

<p>

How can I help you today?

</p>

</div>

</div>

</section>

<div class="suggestions">

<button class="suggestion">

💻 JavaScript

</button>

<button class="suggestion">

🚀 AI Projects

</button>

<button class="suggestion">

📄 Summarize Notes

</button>

<button class="suggestion">

📧 Write Email

</button>

</div>
<!-- INPUT AREA -->

<div class="inputArea">

<label
for="imageInput"
class="iconBtn">

📷

</label>

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

<label
for="fileInput"
class="iconBtn">

📄

</label>

<input
type="file"
id="fileInput"
accept=".pdf,.txt,.doc,.docx"
hidden>

<textarea

id="userInput"

rows="1"

placeholder="Ask anything...">

</textarea>

<button
id="voiceBtn">

🎤

</button>

<button
id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

<footer>

AI may make mistakes. Verify important information.

</footer>

</main>

</div>

<!-- SETTINGS -->

<div
id="settingsModal"
class="settingsModal">

<div class="settingsCard">

<h2>

Settings

</h2>

<label>

Typing Speed

<input
type="range"
id="typingSpeed"
min="5"
max="40"
value="15">

</label>

<label>

Dark Theme

<input
type="checkbox"
id="darkMode"
checked>

</label>

<button
id="closeSettings">

Close

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>

<script src="gemini.js"></script>

<script src="script.js"></script>

</body>

</html>
