<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot V5 Premium</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css"/>

</head>

<body>

<div class="app">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<div class="logo-icon">

🤖

</div>

<div>

<h2>AI Chatbot</h2>

<p>Premium V5</p>

</div>

</div>

<button id="newChatBtn">

<i class="fa-solid fa-plus"></i>

New Chat

</button>

<div class="searchBox">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="searchChat"
placeholder="Search Chats">

</div>

<div
id="historyList"
class="historyList">

</div>

<div class="sidebarBottom">

<button id="exportBtn">

<i class="fa-solid fa-download"></i>

Export Chat

</button>

<button id="clearBtn">

<i class="fa-solid fa-trash"></i>

Clear Chats

</button>

<button id="themeBtn">

🌙 Theme

</button>

</div>

</aside>

<!-- Main -->

<main class="chatArea">

<header>

<div>

<h1>

AI Assistant

</h1>

<p>

Powered by Gemini

</p>

</div>

<div class="headerButtons">

<button id="voiceOutputBtn">

🔊

</button>

<button id="settingsBtn">

⚙️

</button>

</div>

</header>

<section
id="chatBox"
class="chatBox">

<div class="botMessage">

<div class="avatar">

🤖

</div>

<div class="message">

<h3>

Hello Aditya 👋

</h3>

<p>

Welcome to AI Chatbot V5 Premium.

</p>

<p>

I can help with coding,
projects,
assignments,
AI,
web development,
and much more.

</p>

</div>

</div>

</section>

<div class="suggestions">

<button class="suggestion">

💻 Explain JavaScript

</button>

<button class="suggestion">

🚀 AI Project Ideas

</button>

<button class="suggestion">

📧 Write Email

</button>

<button class="suggestion">

📝 Summarize Notes

</button>

</div>

<div class="inputArea">

<label
for="imageInput"
class="iconButton">

📷

</label>

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

<label
for="fileInput"
class="iconButton">

📎

</label>

<input
type="file"
id="fileInput"
accept=".pdf,.docx,.txt"
hidden>

<textarea

id="userInput"

rows="1"

placeholder="Ask anything...">

</textarea>

<button
id="voiceBtn">

🎤

</button>

<button
id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

<footer>

AI responses may contain mistakes.
Verify important information.

</footer>

</main>

</div>

<!-- Settings Modal -->

<div
class="settingsModal"
id="settingsModal">

<div class="settingsContent">

<h2>

Settings

</h2>

<div class="setting">

<label>

Dark Theme

</label>

<input
type="checkbox"
id="darkToggle">

</div>

<div class="setting">

<label>

Typing Speed

</label>

<input
type="range"
id="typingSpeed"
min="5"
max="40"
value="15">

</div>

<button
id="closeSettings">

Close

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>

<script src="gemini.js"></script>

<script src="script.js"></script>

</body>

</html>
