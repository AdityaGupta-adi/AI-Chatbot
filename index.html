<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot V2 Premium</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

</head>

<body>

<div class="app">

<!-- Sidebar -->

<div class="sidebar">

<div class="logo">

<h2>🤖 AI Chatbot</h2>

<p>Premium V2</p>

</div>

<button id="newChatBtn" class="sidebar-btn">

<i class="fa-solid fa-plus"></i>

New Chat

</button>

<button id="exportBtn" class="sidebar-btn">

<i class="fa-solid fa-download"></i>

Export Chat

</button>

<button id="clearHistoryBtn" class="sidebar-btn">

<i class="fa-solid fa-trash"></i>

Clear History

</button>

<div class="history-title">

Recent Chats

</div>

<div id="historyList">

</div>

</div>

<!-- Main Chat -->

<div class="main-chat">

<div class="topbar">

<h1>

🤖 AI Assistant

</h1>

<button id="themeBtn">

🌙

</button>

</div>

<div id="chatBox" class="chat-box">

<div class="bot-message">

<div class="avatar">

🤖

</div>

<div class="message">

<h4>AI Assistant</h4>

<p>

Hello 👋

I'm your Premium AI Chatbot.

How can I help you today?

</p>

</div>

</div>
</div>

<div class="suggestions">

<button class="suggestion">
💻 Explain JavaScript
</button>

<button class="suggestion">
🌦 Weather Today
</button>

<button class="suggestion">
📝 Write an Email
</button>

<button class="suggestion">
💡 Project Ideas
</button>

</div>

<div class="typing-area">

<textarea
id="userInput"
placeholder="Message AI Assistant..."
rows="1"></textarea>

<div class="action-buttons">

<button id="voiceBtn" title="Voice Input">

🎤

</button>

<button id="sendBtn" title="Send">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</div>

<div class="bottom-tools">

<button id="copyChatBtn">

📋 Copy Chat

</button>

<button id="downloadChatBtn">

📥 Download

</button>

<button id="readChatBtn">

🔊 Read

</button>

<button id="stopReadBtn">

⏹ Stop

</button>

</div>
<footer class="footer">

<p>
⚡ Powered by AI Chatbot V2 Premium
</p>

<p>
Made with 💗 by Aditya Gupta
</p>

</footer>

</div>

</div>

<!-- Marked.js (Markdown Support) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Prism.js (Code Highlighting) -->
<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>

<script src="script.js"></script>

</body>
</html>
