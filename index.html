<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot V3 Premium</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css">

</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">

<h2>🤖 AI Chatbot</h2>

<span>Premium V3</span>

</div>

<button id="newChatBtn">

<i class="fa-solid fa-plus"></i>

New Chat

</button>

<button id="exportBtn">

<i class="fa-solid fa-download"></i>

Export Chat

</button>

<button id="clearBtn">

<i class="fa-solid fa-trash"></i>

Clear History

</button>

<div class="history">

<h3>Recent Chats</h3>

<div id="historyList"></div>

</div>

</aside>

<main class="chat-area">

<header>

<h2>

🤖 AI Assistant

</h2>

<button id="themeBtn">

🌙

</button>

</header>

<div id="chatBox" class="chat-box">

<div class="bot-message">

<div class="avatar">

🤖

</div>

<div class="message">

Hello 👋 I'm your Premium AI Assistant.

</div>

</div>
</div>

<div class="suggestions">

<button class="suggestion">
💻 Explain JavaScript
</button>

<button class="suggestion">
🌦️ Weather Today
</button>

<button class="suggestion">
📝 Write an Email
</button>

<button class="suggestion">
💡 Project Ideas
</button>

</div>

<div class="typing-area">

<textarea
id="userInput"
placeholder="Message AI Assistant..."
rows="1"></textarea>

<div class="action-buttons">

<button id="voiceBtn" title="Voice Input">
🎤
</button>

<button id="sendBtn" title="Send">
<i class="fa-solid fa-paper-plane"></i>
</button>

</div>

</div>

<footer class="footer">

<p>⚡ Powered by Gemini 3.6 Flash</p>

<p>Made with 🤍 by Aditya Gupta</p>

</footer>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>

<script src="gemini.js"></script>

<script src="script.js"></script>

</body>

</html>
